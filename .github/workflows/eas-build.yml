name: EAS Build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Restore credentials.json (for local credentials)
      - name: Restore credentials.json
        run: |
          if [ -n "${{ secrets.CREDENTIALS_JSON_BASE64 }}" ]; then
            echo "${{ secrets.CREDENTIALS_JSON_BASE64 }}" | base64 -d > credentials.json
            echo "✅ credentials.json restored"
          else
            echo "⚠️  CREDENTIALS_JSON_BASE64 not set, using remote credentials"
          fi

      # Restore keystore (for local credentials)
      - name: Restore keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/keystores
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystores/release.keystore
            echo "✅ Keystore restored"
          else
            echo "⚠️  KEYSTORE_BASE64 not set"
          fi

      - name: Build Android
        if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' }}
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Build iOS
        if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' }}
        run: |
          eas build \
            --platform ios \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Build summary
        run: |
          echo "### 📦 Build Triggered Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: ${{ github.event.inputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Build is running on EAS. Check progress in Expo dashboard."
