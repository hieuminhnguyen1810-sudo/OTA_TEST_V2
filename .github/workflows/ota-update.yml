name: OTA Update

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update from'
        required: true
        default: 'main'
      channel:
        description: 'Update channel (development, preview, production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: 'Update message'
        required: true
        default: 'Manual OTA update'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Optional: for PR comments if needed
    
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN is not set!"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Load branch configuration
        id: config
        env:
          GITHUB_REF_NAME: ${{ github.event.inputs.target_branch }}
        run: |
          node << 'EOF' > config_output.json
          const config = require('./config/index.js');
          console.log(JSON.stringify({
            app_name: config.appName,
            slug: config.slug,
            package_name: config.packageName,
            scheme: config.scheme
          }));
          EOF

          APP_NAME=$(node -p "require('./config_output.json').app_name")
          PACKAGE_NAME=$(node -p "require('./config_output.json').package_name")

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          echo "✅ Config loaded:"
          echo "   App: $APP_NAME"
          echo "   Package: $PACKAGE_NAME"

      - name: Configure app.json
        run: |
          cp app.json app.json.backup

          node << 'EOF'
          const fs = require('fs');
          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const config = require('./config/index.js');

          appJson.expo.name = config.appName;
          appJson.expo.slug = config.slug;
          appJson.expo.android.package = config.packageName;
          appJson.expo.scheme = config.scheme;

          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
          console.log('✅ Modified app.json');
          EOF

      - name: Publish update
        run: |
          CHANNEL="${{ github.event.inputs.channel }}-${{ github.event.inputs.target_branch }}"
          eas update \
            --branch "$CHANNEL" \
            --message "${{ github.event.inputs.message }}" \
            --non-interactive
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Restore app.json
        if: always()
        run: |
          if [ -f app.json.backup ]; then
            mv app.json.backup app.json
          fi

      - name: Update summary
        run: |
          echo "### 🚀 OTA Update Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.event.inputs.target_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: ${{ github.event.inputs.channel }}-${{ github.event.inputs.target_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.inputs.message }}" >> $GITHUB_STEP_SUMMARY