name: OTA Update

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel (development, preview, production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: 'Update message'
        required: false
        default: 'Manual OTA update'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Optional: for PR comments if needed
    
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANNEL="preview"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            CHANNEL="production"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            CHANNEL="preview"
          else
            CHANNEL="development"
          fi
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "📢 Deploying to channel: $CHANNEL"

      - name: Determine update message
        id: message
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MESSAGE="${{ github.event.inputs.message }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            MESSAGE="PR Preview: ${{ github.event.pull_request.title }}"
          else
            MESSAGE="OTA Update: ${{ github.event.head_commit.message }}"
          fi
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT
          echo "💬 Message: $MESSAGE"

      - name: Publish update
        run: |
          eas update \
            --branch ${{ steps.channel.outputs.channel }} \
            --message "${{ steps.message.outputs.message }}" \
            --non-interactive

      - name: Update summary
        run: |
          echo "### 🚀 OTA Update Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: ${{ steps.channel.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ steps.message.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY